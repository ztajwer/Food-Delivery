<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Operations sign in | ispice majesty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-theme auth-page admin-auth-page">
    <main class="admin-auth-shell"><div class="admin-auth-card">
        <div class="admin-auth-mark"><i data-lucide="shield-check"></i></div><span class="auth-eyebrow">Private operations</span><h1>Operations<br><span class="gradient-text">control room.</span></h1><p class="auth-intro">Authorized team members can manage users, orders, restaurants, and delivery partners.</p>
        <form id="adminLoginForm" class="auth-form" method="POST" action="{{ url_for('admin_login') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group"><label for="adminEmail"><i data-lucide="mail"></i> Work email</label><input id="adminEmail" name="email" type="email" placeholder="name@ispicemajesty.com" required></div>
            <div class="form-group"><label for="adminPassword"><i data-lucide="key-round"></i> Password</label><div class="password-field"><input id="adminPassword" name="password" type="password" placeholder="Enter your password" minlength="6" required><button type="button" class="password-toggle" data-target="adminPassword" aria-label="Show password"><i data-lucide="eye"></i></button></div></div>
            <div class="auth-form-row"><label class="checkbox-label"><input type="checkbox" name="remember"> <span>Keep me signed in</span></label><span class="admin-auth-code">OPS-SECURE</span></div>
            {% if error %}
            <p class="auth-status is-visible is-error" aria-live="polite">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn btn-primary btn-glow auth-submit">Enter control room <i data-lucide="arrow-right"></i></button>
        </form>
        <p class="admin-auth-note"><i data-lucide="info"></i> Customer and delivery workspaces are intentionally separate from this area.</p>
    </div></main>
    <script src="https://unpkg.com/lucide@latest"></script><script>
        if (typeof lucide !== 'undefined') lucide.createIcons(); document.querySelectorAll('.password-toggle').forEach((toggle) => toggle.addEventListener('click', () => { const input = document.getElementById(toggle.dataset.target); const isPassword = input.type === 'password'; input.type = isPassword ? 'text' : 'password'; toggle.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}"></i>`; if (typeof lucide !== 'undefined') lucide.createIcons(); }));
    </script>
</body>
</html>
