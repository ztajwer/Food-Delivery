<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password | ispice majesty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-theme auth-page">
    <main class="auth-shell auth-shell-simple">
        <section class="auth-card-wrap">
            <div class="auth-card auth-card-centered">
                <a href="{{ url_for('home') }}" class="brand-logo auth-brand-centered">
                    <img src="{{ url_for('static', filename='assets/logo.png') }}" class="brand-logo-img" alt="ispice majesty home">
                </a>
                <span class="auth-icon-disc"><i data-lucide="shield-check"></i></span>
                <span class="auth-eyebrow">Customer account</span>
                <h1>Choose a new password</h1>
                <p class="auth-intro">Create a fresh password for your account.</p>

                {% if error %}
                <p class="auth-status is-visible is-error" style="color: #ff6b6b; margin-bottom: 1rem;">{{ error }}</p>
                {% endif %}

                <form method="POST" action="{{ url_for('reset_password') }}" class="auth-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="form-group">
                        <label for="resetEmail"><i data-lucide="mail"></i> Account Email</label>
                        <input id="resetEmail" name="email" type="email" value="{{ email or '' }}" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="newPassword"><i data-lucide="lock"></i> New password</label>
                        <div class="password-field">
                            <input id="newPassword" name="new_password" type="password" minlength="6" placeholder="At least 6 characters" required>
                            <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword"><i data-lucide="check-circle"></i> Confirm password</label>
                        <input id="confirmPassword" name="confirm_password" type="password" minlength="6" placeholder="Repeat your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-glow auth-submit">
                        Update password <i data-lucide="check"></i>
                    </button>
                </form>

                <a href="{{ url_for('login') }}" class="auth-back-link" style="margin-top: 1.5rem;">
                    <i data-lucide="arrow-left"></i> Return to sign in
                </a>
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
        document.querySelectorAll('.password-toggle').forEach((toggle) => {
            toggle.addEventListener('click', () => {
                const input = document.getElementById(toggle.dataset.target);
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                toggle.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}"></i>`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
            });
        });
    </script>
</body>
</html>
