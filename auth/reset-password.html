<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password | ispice majesty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-theme auth-page">
    <main class="auth-shell auth-shell-simple"><section class="auth-card-wrap"><div class="auth-card auth-card-centered">
        <a href="{{ url_for('home') }}" class="brand-logo auth-brand-centered"><img src="{{ url_for('static', filename='assets/logo.png') }}" class="brand-logo-img" alt="ispice majesty home"></a><span class="auth-icon-disc"><i data-lucide="shield-check"></i></span><span class="auth-eyebrow">Customer account</span><h1>Choose a new password</h1><p class="auth-intro">Create a fresh password for your guest workspace.</p>
        <form id="resetForm" class="auth-form"><div class="form-group"><label for="newPassword">New password</label><div class="password-field"><input id="newPassword" type="password" minlength="6" placeholder="At least 6 characters" required><button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password"><i data-lucide="eye"></i></button></div></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="6" placeholder="Repeat your password" required></div><button type="submit" class="btn btn-primary btn-glow auth-submit">Update password <i data-lucide="check"></i></button><p class="auth-status" id="resetStatus" aria-live="polite"></p></form>
        <a href="{{ url_for('login') }}" class="auth-back-link"><i data-lucide="arrow-left"></i> Return to sign in</a>
    </div></section></main>
    <script src="https://unpkg.com/lucide@latest"></script><script>
        if (typeof lucide !== 'undefined') lucide.createIcons(); document.querySelectorAll('.password-toggle').forEach((toggle) => toggle.addEventListener('click', () => { const input = document.getElementById(toggle.dataset.target); const isPassword = input.type === 'password'; input.type = isPassword ? 'text' : 'password'; toggle.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}"></i>`; if (typeof lucide !== 'undefined') lucide.createIcons(); })); document.getElementById('resetForm').addEventListener('submit', (event) => { event.preventDefault(); const status = document.getElementById('resetStatus'); const password = document.getElementById('newPassword').value; const confirmation = document.getElementById('confirmPassword').value; status.classList.remove('is-error'); if (password !== confirmation) { status.textContent = 'Passwords do not match.'; status.classList.add('is-visible', 'is-error'); return; } status.textContent = 'Demo mode: password updated successfully.'; status.classList.add('is-visible'); });
    </script>
</body>
</html>
