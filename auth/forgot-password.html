<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset customer password | ispice majesty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-theme auth-page">
    <main class="auth-shell auth-shell-simple"><section class="auth-card-wrap"><div class="auth-card auth-card-centered">
        <a href="{{ url_for('home') }}" class="brand-logo auth-brand-centered"><img src="{{ url_for('static', filename='assets/logo.png') }}" class="brand-logo-img" alt="ispice majesty home"></a><span class="auth-icon-disc"><i data-lucide="key-round"></i></span><span class="auth-eyebrow">Customer account</span><h1>Forgot your password?</h1><p class="auth-intro">Enter your email and we’ll prepare a password reset link in this UI demo.</p>
        <form id="forgotForm" class="auth-form"><div class="form-group"><label for="forgotEmail"><i data-lucide="mail"></i> Email address</label><input id="forgotEmail" type="email" placeholder="you@example.com" required></div><button type="submit" class="btn btn-primary btn-glow auth-submit">Send reset link <i data-lucide="send"></i></button><p class="auth-status" id="forgotStatus" aria-live="polite"></p></form>
        <a href="{{ url_for('reset_password') }}" class="auth-text-link">Continue to reset password screen <i data-lucide="arrow-right"></i></a><a href="{{ url_for('login') }}" class="auth-back-link"><i data-lucide="arrow-left"></i> Back to sign in</a>
    </div></section></main>
    <script src="https://unpkg.com/lucide@latest"></script><script>if (typeof lucide !== 'undefined') lucide.createIcons(); document.getElementById('forgotForm').addEventListener('submit', (event) => { event.preventDefault(); const status = document.getElementById('forgotStatus'); status.textContent = 'Demo mode: reset link prepared. Check the next screen.'; status.classList.add('is-visible'); });</script>
</body>
</html>
