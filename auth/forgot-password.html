<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset customer password | ispice majesty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-theme auth-page">
    <main class="auth-shell auth-shell-simple">
        <section class="auth-card-wrap">
            <div class="auth-card auth-card-centered">
                <a href="{{ url_for('home') }}" class="brand-logo auth-brand-centered">
                    <img src="{{ url_for('static', filename='assets/logo.png') }}" class="brand-logo-img" alt="ispice majesty home">
                </a>
                <span class="auth-icon-disc"><i data-lucide="key-round"></i></span>
                <span class="auth-eyebrow">Customer account</span>
                <h1>Forgot your password?</h1>
                <p class="auth-intro">Enter your registered email and we will help you choose a new password.</p>

                {% if error %}
                <p class="auth-status is-visible is-error" style="color: #ff6b6b; margin-bottom: 1rem;">{{ error }}</p>
                {% endif %}

                <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label for="forgotEmail"><i data-lucide="mail"></i> Email address</label>
                        <input id="forgotEmail" name="email" type="email" placeholder="you@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-glow auth-submit">
                        Continue to Reset <i data-lucide="arrow-right"></i>
                    </button>
                </form>

                <a href="{{ url_for('login') }}" class="auth-back-link" style="margin-top: 1.5rem;">
                    <i data-lucide="arrow-left"></i> Back to sign in
                </a>
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>if (typeof lucide !== 'undefined') lucide.createIcons();</script>
</body>
</html>
