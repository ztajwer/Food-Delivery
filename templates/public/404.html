<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found | ispice majesty</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-theme theme-charcoal">

    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
        <a href="{{ url_for('home') }}" style="margin-bottom: 2rem;">
            <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="ispice majesty Logo" class="brand-logo-img">
        </a>
        <h1 style="font-size: clamp(4rem, 12vw, 9rem); font-family: var(--font-heading); color: var(--primary); line-height: 1;">404</h1>
        <h2 style="font-size: 2rem; margin-top: 0.5rem; font-family: var(--font-heading);">Culinary Path Not Found</h2>
        <p style="color: var(--text-muted); max-width: 480px; margin: 1rem 0 2rem 0;">The exhibition page you requested does not exist or has been relocated.</p>
        <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg"><i data-lucide="home"></i> Return to Exhibition Home</a>
    </div>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>
</html>
